services:
  - type: web
    name: sequence-coach
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COPILOT_DIRECTLINE_SECRET
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: ACCOUNTS
        sync: false
      - key: AUTH_DISABLED
        value: "1"
      - key: FIX_ENABLED
        value: "1"
